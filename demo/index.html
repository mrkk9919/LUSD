<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUSD — 正在前往 DApp</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="../dapp/">
<meta http-equiv="refresh" content="1;url=../dapp/">
<style>
  html,body{height:100%}
  body{margin:0;background:#000;color:#f5f6f8;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .box{text-align:center;padding:24px}
  .dot{width:38px;height:38px;border-radius:50%;margin:0 auto 18px;
    border:2px solid rgba(183,255,26,.22);border-top-color:#b7ff1a;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:15px;font-weight:600;margin:0 0 8px;letter-spacing:.01em}
  p{font-size:12.5px;color:#8a8f98;margin:0 0 18px}
  a{display:inline-block;font-size:12.5px;font-weight:700;color:#b7ff1a;text-decoration:none;
    border:1px solid rgba(183,255,26,.35);border-radius:8px;padding:9px 18px}
  a:active{background:rgba(183,255,26,.08)}
</style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h1>正在进入 LUSD DApp</h1>
    <p>演示页已升级为 DApp</p>
    <a href="../dapp/" id="go">立即前往 →</a>
  </div>
<script>
  (function(){
    var t='../dapp/'+(location.search||'')+(location.hash||'');
    document.getElementById('go').href=t;
    setTimeout(function(){ location.replace(t); }, 600);
  })();
</script>
</body>
</html>
